name: Bug report
description: Report a reproducible problem with the skill, installer, references, or release package.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Remove confidential manuscript text, credentials, and private research data before submitting.
  - type: input
    id: version
    attributes:
      label: Version or commit
      placeholder: "0.1.0 or 49fa42d"
    validations:
      required: true
  - type: dropdown
    id: host
    attributes:
      label: Host
      options:
        - Codex
        - Claude Code
        - Installer
        - Release archive
        - Reference builder
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      description: List the smallest sequence that reproduces the issue.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Environment and logs
      description: Include OS, Python version, and redacted output that helps reproduce the issue.
    validations:
      required: false
